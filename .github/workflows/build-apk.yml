name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Instalar dependencias
        run: npm install
      - name: Preparar carpeta web
        run: npm run build:web
      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Inicializar Capacitor (si no existe)
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init Seend com.seend.app --web-dir=www
          fi
      - name: Añadir plataforma Android (si no existe)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sincronizar web con Android
        run: npx cap sync android
      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew
      - name: Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: seend-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
