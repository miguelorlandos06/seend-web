<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seend · Chat</title>
<style>
  :root {
    --azul: #2563eb; --azul-oscuro: #1e40af; --azul-claro: #dbeafe;
    --fondo: #f8fafc; --borde: #e2e8f0; --texto: #0f172a; --texto-suave: #64748b;
    --en-linea: #2563eb; --peligro: #ef4444; --verde: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); height: 100vh; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  
  .app { display: flex; height: 100vh; }
  .col-izq { width: 340px; background: white; border-right: 1px solid var(--borde); display: flex; flex-direction: column; flex-shrink: 0; position: relative; z-index: 10; }
  .col-der { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--fondo); position: relative; }
  
  .topbar { background: white; border-bottom: 1px solid var(--borde); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; height: 64px; }
  .topbar h1 { font-size: 18px; font-weight: 800; flex: 1; letter-spacing: -0.3px; }
  .btn-volver { background: none; border: none; cursor: pointer; color: var(--azul); padding: 6px; display: flex; align-items: center; border-radius: 50%; transition: background .15s; }
  .btn-volver:hover { background: var(--azul-claro); }
  .btn-volver svg { width: 22px; height: 22px; }
  
  .mi-perfil-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 4px 8px 4px 4px; border-radius: 20px; transition: background .15s; }
  .mi-perfil-btn:hover { background: var(--fondo); }
  .mi-perfil-btn.oculto { display: none; }
  .mi-perfil-btn .avatar { width: 36px; height: 36px; font-size: 14px; }
  .mi-perfil-btn .mi-nombre { font-size: 14px; font-weight: 600; color: var(--texto); max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #lista-chats { flex: 1; overflow-y: auto; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--borde); cursor: pointer; transition: background .1s; }
  .chat-item:hover { background: #f1f5f9; }
  .chat-item.activo { background: var(--azul-claro); }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--azul-claro); color: var(--azul-oscuro); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center; }
  .chat-item .datos { flex: 1; min-width: 0; }
  .chat-item .fila1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .chat-item .nombre { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .hora { font-size: 11px; color: var(--texto-suave); flex-shrink: 0; font-weight: 500; }
  .chat-item .fila2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 3px; }
  .chat-item .ultimo { font-size: 13.5px; color: var(--texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; display: flex; align-items: center; gap: 4px; }
  .chat-item .ultimo.escribiendo { color: var(--azul); font-style: italic; font-weight: 500; }
  .chat-item .badge { background: var(--azul); color: white; font-size: 11px; font-weight: 700; min-width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; padding: 0 6px; flex-shrink: 0; box-shadow: 0 2px 4px rgba(37,99,235,.3); }
  .vacio { text-align: center; color: var(--texto-suave); font-size: 14px; padding: 40px 20px; line-height: 1.5; }
  #btn-nuevo { position: absolute; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--azul); color: white; border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(37,99,235,.4); cursor: pointer; transition: all .2s; z-index: 5; }
  #btn-nuevo:hover { background: var(--azul-oscuro); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37,99,235,.5); }
  #btn-nuevo:active { transform: scale(.95); }
  #btn-nuevo.oculto { display: none; }
  #btn-nuevo svg { width: 26px; height: 26px; }

  #lista-usuarios { flex: 1; overflow-y: auto; background: white; }
  .separador { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--texto-suave); padding: 16px 18px 8px; background: var(--fondo); }
  .usuario-item { display: flex; align-items: center; gap: 12px; padding: 12px 18px; cursor: pointer; transition: background .1s; border-bottom: 1px solid var(--borde); }
  .usuario-item:hover { background: #f1f5f9; }
  .usuario-item .avatar { width: 44px; height: 44px; font-size: 16px; }
  .usuario-item .datos { flex: 1; min-width: 0; }
  .usuario-item .nombre { font-size: 15px; font-weight: 600; }
  .usuario-item .estado { font-size: 13px; color: var(--texto-suave); margin-top: 2px; }
  .usuario-item .estado.en-linea { color: var(--en-linea); font-weight: 500; }

  #conv-header { background: white; border-bottom: 1px solid var(--borde); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; height: 64px; position: relative; }
  #conv-header .btn-volver { margin-right: 2px; }
  #conv-header .perfil-btn { display: flex; align-items: center; gap: 12px; background: none; border: none; cursor: pointer; padding: 4px 8px 4px 4px; border-radius: 10px; flex: 1; min-width: 0; transition: background .15s; text-align: left; }
  #conv-header .perfil-btn:hover { background: var(--fondo); }
  #conv-header .avatar { width: 42px; height: 42px; font-size: 17px; }
  #conv-header .info { flex: 1; min-width: 0; }
  #conv-header .nombre { font-size: 16px; font-weight: 700; }
  #conv-header .estado { font-size: 12.5px; color: var(--texto-suave); margin-top: 1px; transition: color .15s; }
  #conv-header .estado.en-linea { color: var(--en-linea); }
  #conv-header .estado.escribiendo { color: var(--azul); font-style: italic; font-weight: 500; }
  .btn-menu-conv { background: none; border: none; cursor: pointer; padding: 8px; color: var(--texto-suave); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .btn-menu-conv:hover { background: var(--fondo); color: var(--texto); }
  .menu-opciones { position: absolute; top: 56px; right: 16px; background: white; border: 1px solid var(--borde); border-radius: 12px; box-shadow: 0 10px 25px rgba(15,23,42,.15); z-index: 30; display: none; flex-direction: column; min-width: 180px; overflow: hidden; animation: aparecerMenu .15s ease-out; }
  .menu-opciones.activa { display: flex; }
  .menu-opciones button { background: none; border: none; padding: 14px 18px; text-align: left; font-size: 14px; color: var(--peligro); cursor: pointer; font-family: inherit; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .menu-opciones button:hover { background: #fef2f2; }
  .menu-opciones button svg { width: 18px; height: 18px; }
  @keyframes aparecerMenu { from { opacity: 0; transform: scale(.95) translateY(-5px); } to { opacity: 1; transform: none; } }

  #mensajes { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 75%; min-width: 70px; padding: 9px 14px; border-radius: 16px; background: var(--azul); color: white; align-self: flex-start; position: relative; cursor: pointer; word-wrap: break-word; animation: aparecer .2s ease-out; box-shadow: 0 1px 2px rgba(15,23,42,.08); }
  .msg.propio { background: white; color: var(--texto); border: 1px solid var(--borde); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg:not(.propio) { border-bottom-left-radius: 4px; }
  .msg .texto { font-size: 15px; line-height: 1.4; white-space: pre-wrap; }
  .msg .cita { border-left: 3px solid currentColor; padding: 4px 10px; margin-bottom: 6px; background: rgba(255,255,255,.15); border-radius: 6px; font-size: 12.5px; opacity: .9; }
  .msg.propio .cita { background: rgba(0,0,0,.04); }
  .msg .cita .cita-autor { font-weight: 700; margin-bottom: 2px; }
  .msg .cita .cita-texto { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg .meta { float: right; margin-left: 10px; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
  .msg .hora { font-size: 10.5px; opacity: .7; font-weight: 500; }
  .msg .check { display: inline-flex; align-items: center; }
  .msg .check svg { width: 16px; height: 16px; }
  .msg .check.enviado { color: #94a3b8; }
  .msg .check.entregado { color: #64748b; }
  .msg .check.visto { color: var(--azul); }
  @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  #barra-respuesta { display: none; background: white; border-top: 1px solid var(--borde); padding: 10px 16px; align-items: center; gap: 12px; }
  #barra-respuesta.activa { display: flex; }
  #barra-respuesta .linea { border-left: 3px solid var(--azul); padding-left: 12px; flex: 1; min-width: 0; }
  #barra-respuesta .linea .autor { font-size: 12px; font-weight: 700; color: var(--azul); }
  #barra-respuesta .linea .texto { font-size: 13px; color: var(--texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #barra-respuesta .cerrar { background: none; border: none; font-size: 22px; color: var(--texto-suave); cursor: pointer; padding: 4px 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  #barra-respuesta .cerrar:hover { background: var(--fondo); }

  #form { background: white; border-top: 1px solid var(--borde); padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  #texto { flex: 1; padding: 12px 18px; border: 1.5px solid var(--borde); border-radius: 24px; outline: none; font-size: 15px; background: var(--fondo); resize: none; max-height: 120px; min-height: 46px; line-height: 1.4; font-family: inherit; color: var(--texto); transition: all .2s; }
  #texto:focus { background: white; border-color: var(--azul); box-shadow: 0 0 0 4px rgba(37,99,235,.1); }
  .btn-icono { width: 46px; height: 46px; border: none; border-radius: 50%; background: var(--fondo); color: var(--texto-suave); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; }
  .btn-icono:hover { background: var(--azul-claro); color: var(--azul); }
  .btn-icono:active { transform: scale(.92); }
  .btn-icono svg { width: 22px; height: 22px; }
  #enviar { background: var(--azul); color: white; box-shadow: 0 2px 8px rgba(37,99,235,.3); }
  #enviar:hover { background: var(--azul-oscuro); color: white; }
  #enviar:disabled { background: #cbd5e1; color: white; cursor: default; box-shadow: none; }

  /* --- ESTILOS DE PERFIL (TIPO TELEGRAM) --- */
  .pantalla-perfil {
    position: absolute; inset: 0; background: white; z-index: 30; 
    display: none; flex-direction: column;
    animation: deslizarDerecha .25s ease-out;
  }
  .pantalla-perfil.activa { display: flex; }
  @keyframes deslizarDerecha { from { transform: translateX(100%); } to { transform: translateX(0); } }
  
  .perfil-header { padding: 60px 24px 30px; display: flex; flex-direction: column; align-items: center; position: relative; }
  .perfil-avatar { width: 120px; height: 120px; border-radius: 50%; background: var(--azul-claro); color: var(--azul-oscuro); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; overflow: hidden; background-size: cover; background-position: center; box-shadow: 0 8px 24px rgba(37,99,235,.15); }
  .btn-camara { position: absolute; bottom: 30px; right: calc(50% - 60px); width: 40px; height: 40px; border-radius: 50%; background: var(--verde); color: white; border: 3px solid white; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); transition: transform .15s; }
  .btn-camara:hover { transform: scale(1.1); }
  .btn-camara svg { width: 20px; height: 20px; }
  
  .perfil-item { display: flex; align-items: center; gap: 20px; padding: 16px 24px; cursor: pointer; border-bottom: 1px solid var(--borde); transition: background .15s; }
  .perfil-item:hover { background: var(--fondo); }
  .perfil-item .icono { color: var(--texto-suave); display: flex; align-items: center; justify-content: center; }
  .perfil-item .icono svg { width: 24px; height: 24px; }
  .perfil-item .datos { flex: 1; }
  .perfil-item .label { font-size: 16px; font-weight: 500; color: var(--texto); }
  .perfil-item .valor { font-size: 14px; color: var(--texto-suave); margin-top: 2px; }
  .perfil-item .valor.verde { color: var(--verde); }

  /* Pantallas de edición (Nombre, Usuario, Info) */
  .pantalla-edicion { position: absolute; inset: 0; background: white; z-index: 40; display: none; flex-direction: column; animation: deslizarDerecha .25s ease-out; }
  .pantalla-edicion.activa { display: flex; }
  .edicion-cuerpo { flex: 1; padding: 24px; }
  .campo-edicion { position: relative; margin-bottom: 24px; }
  .campo-edicion label { position: absolute; top: -8px; left: 12px; background: white; padding: 0 4px; font-size: 12px; color: var(--verde); font-weight: 500; }
  .campo-edicion input, .campo-edicion textarea { width: 100%; padding: 16px; border: 1.5px solid var(--verde); border-radius: 8px; font-size: 16px; outline: none; font-family: inherit; color: var(--texto); background: white; }
  .campo-edicion textarea { resize: vertical; min-height: 100px; }
  .btn-guardar-edicion { width: calc(100% - 48px); margin: 0 24px 24px; padding: 16px; border: none; border-radius: 24px; background: var(--verde); color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: background .15s; }
  .btn-guardar-edicion:hover { background: #16a34a; }

  #visor { position: fixed; inset: 0; background: rgba(15,23,42,.95); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; backdrop-filter: blur(4px); }
  #visor.activo { display: flex; }
  #visor img { max-width: 92%; max-height: 92%; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,.5); }

  .imagen-pendiente { position: relative; width: 220px; height: 160px; margin-top: 6px; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg,#e2e8f0 0%,#cbd5e1 100%); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; cursor: default; }
  .imagen-pendiente .difuminado { position: absolute; inset: 0; backdrop-filter: blur(12px); background: rgba(255,255,255,.1); }
  .imagen-pendiente .btn-descargar { position: relative; z-index: 1; width: 48px; height: 48px; border-radius: 50%; border: none; background: rgba(255,255,255,.8); color: var(--azul); display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(4px); transition: all .15s; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .imagen-pendiente .btn-descargar:hover { background: white; transform: scale(1.05); }
  .imagen-pendiente .btn-descargar:active { transform: scale(.95); }
  .imagen-pendiente .btn-descargar svg { width: 24px; height: 24px; }
  .imagen-pendiente .tamano { position: absolute; bottom: 8px; right: 10px; font-size: 11px; color: white; font-weight: 600; z-index: 1; background: rgba(0,0,0,.6); padding: 3px 8px; border-radius: 6px; backdrop-filter: blur(4px); }
  .anillo-progreso { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
  .anillo-progreso circle { fill: none; stroke-width: 3.5; }
  .anillo-progreso .fondo { stroke: rgba(37,99,235,.2); }
  .anillo-progreso .frente { stroke: var(--azul); stroke-linecap: round; transition: stroke-dashoffset .15s; }
  .imagen-cargada { margin-top: 6px; }
  .imagen-cargada .imagen { max-width: 250px; max-height: 250px; width: auto; height: auto; border-radius: 12px; display: block; cursor: zoom-in; box-shadow: 0 2px 8px rgba(0,0,0,.1); }

  @media (max-width: 768px) {
    .app { position: relative; }
    .col-izq { width: 100%; border-right: none; }
    .col-der { display: none; }
    .app.chat-abierto .col-izq { display: none; }
    .app.chat-abierto .col-der { display: flex; }
    .col-der.vacio { display: none; }
    #btn-nuevo { position: fixed; bottom: 24px; right: 24px; }
    .mi-perfil-btn .mi-nombre { display: none; }
    #perfil-otro { position: fixed; inset: 0; width: 100%; transform: translateX(100%); border-left: none; box-shadow: none; }
    #perfil-otro.activa { transform: translateX(0); }
    .imagen-pendiente { width: 180px; height: 130px; }
    .imagen-cargada .imagen { max-width: 200px; max-height: 200px; }
    .msg { max-width: 85%; }
  }
  @media (min-width: 769px) {
    .col-der.vacio { display: flex; align-items: center; justify-content: center; color: var(--texto-suave); font-size: 15px; font-weight: 500; background: var(--fondo); }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="col-izq">
    <div class="topbar">
      <button class="btn-volver" id="volver-usuarios" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <h1 id="titulo-izq">Mensajes</h1>
      <button class="mi-perfil-btn" id="mi-perfil-btn" title="Mi perfil"><div class="avatar" id="mi-avatar">?</div><span class="mi-nombre" id="mi-nombre"></span></button>
    </div>
    <div id="lista-chats"></div>
    <div id="lista-usuarios" style="display:none;"></div>
    <button id="btn-nuevo" title="Nuevo chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  </div>
  
  <div class="col-der vacio" id="col-der">
    <div id="placeholder-conv">Selecciona una conversación para empezar a chatear</div>
    <div id="pantalla-conv" style="display:none; flex:1; flex-direction:column; min-height:0;">
      <div id="conv-header">
        <button class="btn-volver" id="volver-conv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="perfil-btn" id="conv-perfil-btn">
          <div class="avatar" id="conv-avatar">?</div>
          <div class="info">
            <div class="nombre" id="conv-nombre"></div>
            <div class="estado" id="conv-estado"></div>
          </div>
        </button>
        <button class="btn-menu-conv" id="btn-menu-conv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
        <div class="menu-opciones" id="menu-opciones">
          <button id="btn-eliminar-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Eliminar conversación</button>
        </div>
      </div>
      <div id="mensajes"></div>
      <div id="barra-respuesta">
        <div class="linea"><div class="autor" id="resp-autor"></div><div class="texto" id="resp-texto"></div></div>
        <button class="cerrar" id="resp-cerrar" type="button">×</button>
      </div>
      <form id="form">
        <button type="button" class="btn-icono" id="btn-imagen" title="Adjuntar imagen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <input type="file" id="file-input" accept="image/*" hidden>
        <textarea id="texto" placeholder="Escribe un mensaje..." rows="1"></textarea>
        <button type="submit" class="btn-icono" id="enviar" title="Enviar" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </form>
    </div>
  </div>

  <!-- PANEL: PERFIL DE OTRO USUARIO -->
  <div id="perfil-otro" class="pantalla-perfil">
    <div class="topbar">
      <button class="btn-volver" onclick="document.getElementById('perfil-otro').classList.remove('activa'); perfilAbierto=null;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <h1>Perfil</h1>
    </div>
    <div class="perfil-header">
      <div class="perfil-avatar" id="otro-perfil-avatar">?</div>
    </div>
    <div class="perfil-item">
      <div class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      <div class="datos">
        <div class="label">Nombre</div>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = 'auth.html';
  const WS_URL = "wss://seend-i33g.onrender.com/ws";
  let ws, nombre = localStorage.getItem('nombre') || '';
  let chatActual=null, respondiendoA=null;
  let escribiendoTimeout=null, ultimoEnvioEscribiendo=0;
  const escribiendoPorChat={}; 
  let chatsCache=[], usuariosCache=[];
  let perfilPropio={nombre:'',bio:'',avatar:''}; 
  let perfilAbierto=null;

  const app=document.getElementById('app');
  const colDer=document.getElementById('col-der');
  const placeholderConv=document.getElementById('placeholder-conv');
  const pantallaConv=document.getElementById('pantalla-conv');
  const listaChats=document.getElementById('lista-chats');
  const listaUsuarios=document.getElementById('lista-usuarios');
  const tituloIzq=document.getElementById('titulo-izq');
  const volverUsuarios=document.getElementById('volver-usuarios');
  const btnNuevo=document.getElementById('btn-nuevo');
  const mensajesEl=document.getElementById('mensajes');
  const textoEl=document.getElementById('texto');
  const formEl=document.getElementById('form');
  const btnEnviar=document.getElementById('enviar');
  const btnImagen=document.getElementById('btn-imagen');
  const fileInput=document.getElementById('file-input');
  const barraResp=document.getElementById('barra-respuesta');
  const respAutor=document.getElementById('resp-autor');
  const respTexto=document.getElementById('resp-texto');
  const respCerrar=document.getElementById('resp-cerrar');
  const visor=document.getElementById('visor');
  const visorImg=document.getElementById('visor-img');
  const convAvatar=document.getElementById('conv-avatar');
  const convNombre=document.getElementById('conv-nombre');
  const convEstado=document.getElementById('conv-estado');
  const miAvatar=document.getElementById('mi-avatar');
  const miNombre=document.getElementById('mi-nombre');
  const miPerfil=document.getElementById('mi-perfil');
  const perfilOtro=document.getElementById('perfil-otro');
  const miPerfilBtn=document.getElementById('mi-perfil-btn');

  btnNuevo.onclick=()=>mostrarUsuarios();
  volverUsuarios.onclick=()=>mostrarHome();
  document.getElementById('volver-conv').onclick=()=>cerrarChat();
  miPerfilBtn.onclick=()=>abrirMiPerfil();
  document.getElementById('cerrar-sesion').onclick=()=>{localStorage.removeItem('token');localStorage.removeItem('nombre');window.location.href='auth.html';};
  document.getElementById('btn-cambiar-avatar').onclick=()=>document.getElementById('avatar-input').click();
  
  document.getElementById('btn-menu-conv').onclick = (e) => { e.stopPropagation(); document.getElementById('menu-opciones').classList.toggle('activa'); };
  document.addEventListener('click', (e) => { if (!e.target.closest('#btn-menu-conv') && !e.target.closest('#menu-opciones')) document.getElementById('menu-opciones').classList.remove('activa'); });
  document.getElementById('btn-eliminar-chat').onclick = () => {
    if (chatActual && confirm('¿Eliminar esta conversación para ti?')) {
      ws.send(JSON.stringify({tipo:'eliminar_chat', otro:chatActual}));
      document.getElementById('menu-opciones').classList.remove('activa');
      cerrarChat();
    }
  };

  document.getElementById('avatar-input').onchange=(e)=>{
    const f=e.target.files[0]; if(!f)return;
    if(f.size>300*1024){alert('La foto debe ser menor de 300 KB');e.target.value='';return;}
    cambiarAvatar(f); e.target.value='';
  };

  function estadoTexto(u){
    if(escribiendoPorChat[u]) return {texto:'Escribiendo...',clase:'escribiendo'};
    let c=chatsCache.find(x=>x.otro===u)||usuariosCache.find(x=>x.nombre===u);
    if(!c) return {texto:'',clase:''};
    if(c.en_linea) return {texto:'En línea',clase:'en-linea'};
    const ult=c.ultima||0;
    if(!ult) return {texto:'Desconectado',clase:''};
    const ahora=Date.now()/1000, diff=ahora-ult;
    if(diff<60) return {texto:'Últ. conexión hace un momento',clase:''};
    if(diff<3600) return {texto:`Últ. conexión hace ${Math.floor(diff/60)} min`,clase:''};
    const d=new Date(ult*1000), hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
    if(d.toDateString()===new Date().toDateString()) return {texto:`Últ. conexión hoy a las ${hh}:${mm}`,clase:''};
    return {texto:`Últ. conexión ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${hh}:${mm}`,clase:''};
  }
  function aplicarEstado(el,u){const e=estadoTexto(u);el.textContent=e.texto;el.classList.remove('en-linea','escribiendo');if(e.clase)el.classList.add(e.clase);}

  function mostrarHome(){tituloIzq.textContent='Mensajes';volverUsuarios.style.display='none';listaChats.style.display='block';listaUsuarios.style.display='none';btnNuevo.classList.remove('oculto');miPerfilBtn.classList.remove('oculto');pintarChats(chatsCache);}
  function mostrarUsuarios(){tituloIzq.textContent='Usuarios';volverUsuarios.style.display='flex';listaChats.style.display='none';listaUsuarios.style.display='block';btnNuevo.classList.add('oculto');miPerfilBtn.classList.add('oculto');ws.send(JSON.stringify({tipo:'pedir_usuarios'}));}
  function cerrarChat(){chatActual=null;app.classList.remove('chat-abierto');pantallaConv.style.display='none';placeholderConv.style.display='block';colDer.classList.add('vacio');document.querySelectorAll('.chat-item.activo').forEach(e=>e.classList.remove('activo'));perfilOtro.classList.remove('activa');perfilAbierto=null;miPerfilBtn.classList.remove('oculto');}

  function pintarAvatar(el, avatar, n) {
    if (avatar) {
      el.style.backgroundImage = `url('${avatar}')`;
      el.textContent = '';
    } else {
      el.style.backgroundImage = '';
      el.textContent = (n||'?')[0].toUpperCase();
    }
  }

  function actualizarMiAvatar(){pintarAvatar(miAvatar,perfilPropio.avatar,nombre);miNombre.textContent=nombre;}

  // --- LÓGICA DEL PERFIL ---
  function abrirMiPerfil(){
    document.getElementById('mi-perfil-nombre-val').textContent = perfilPropio.nombre || nombre;
    document.getElementById('mi-perfil-user-val').textContent = '@' + (perfilPropio.nombre || nombre).toLowerCase().replace(/\s/g,'');
    document.getElementById('mi-perfil-bio-val').textContent = perfilPropio.bio || 'Completar sección Info.';
    document.getElementById('mi-perfil-bio-val').className = perfilPropio.bio ? 'valor' : 'valor verde';
    pintarAvatar(document.getElementById('mi-perfil-avatar'), perfilPropio.avatar, nombre);
    miPerfil.classList.add('activa');
  }

  function abrirEdicion(tipo){
    if(tipo === 'nombre'){
      document.getElementById('edit-nombre-input').value = perfilPropio.nombre || nombre;
      document.getElementById('pantalla-edit-nombre').classList.add('activa');
    } else {
      document.getElementById('edit-bio-input').value = perfilPropio.bio || '';
      document.getElementById('pantalla-edit-bio').classList.add('activa');
    }
  }

  function guardarEdicion(tipo){
    let nuevoNombre = perfilPropio.nombre || nombre;
    let nuevaBio = perfilPropio.bio || '';

    if(tipo === 'nombre') nuevoNombre = document.getElementById('edit-nombre-input').value.trim();
    else nuevaBio = document.getElementById('edit-bio-input').value.trim();

    if(!nuevoNombre) return alert('El nombre no puede estar vacío');

    ws.send(JSON.stringify({tipo:'actualizar_perfil', nombre: nuevoNombre, bio: nuevaBio, avatar_url: perfilPropio.avatar || ''}));
    
    // Cerrar pantallas de edición
    document.querySelectorAll('.pantalla-edicion').forEach(p => p.classList.remove('activa'));
    miPerfil.classList.remove('activa');
  }

  function abrirPerfilOtro(q){
    perfilAbierto=q;
    let c=chatsCache.find(x=>x.otro===q)||usuariosCache.find(x=>x.nombre===q);
    pintarAvatar(document.getElementById('otro-perfil-avatar'),c?c.avatar:'',q);
    document.getElementById('otro-perfil-nombre').textContent=q;
    document.getElementById('otro-perfil-bio').textContent='Cargando...';
    perfilOtro.classList.add('activa');
    ws.send(JSON.stringify({tipo:'pedir_perfil',quien:q}));
  }

  function conectar(){
    ws=new WebSocket(WS_URL);
    ws.onopen=()=>ws.send(JSON.stringify({tipo:'validar_sesion',token}));
    ws.onmessage=e=>{
      const m=JSON.parse(e.data);
      if(m.tipo==='sesion_valida'){nombre=m.nombre;localStorage.setItem('nombre',nombre);actualizarMiAvatar();ws.send(JSON.stringify({tipo:'entrar',token}));}
      else if(m.tipo==='sesion_invalida'){localStorage.removeItem('token');localStorage.removeItem('nombre');window.location.href='auth.html';}
      else if(m.tipo==='chats'){chatsCache=m.chats;pintarChats(chatsCache);if(chatActual)actualizarHeaderEstado();}
      else if(m.tipo==='usuarios'){usuariosCache=m.usuarios;pintarUsuarios(m.usuarios);}
      else if(m.tipo==='conversacion')abrirConversacion(m.otro,m.mensajes,m.en_linea);
      else if(m.tipo==='mensaje')recibirMensaje(m.mensaje,m.eco);
      else if(m.tipo==='estados')actualizarEstados(m.ids,m.estado);
      else if(m.tipo==='escribiendo')manejarEscribiendo(m.de,m.activo);
      else if(m.tipo==='presencia'){
        const c=chatsCache.find(x=>x.otro===m.usuario);if(c){c.en_linea=m.en_linea;c.ultima=m.ultima||c.ultima;}
        const u=usuariosCache.find(x=>x.nombre===m.usuario);if(u){u.en_linea=m.en_linea;u.ultima=m.ultima||u.ultima;}
        if(chatActual===m.usuario)actualizarHeaderEstado();
        if(perfilAbierto===m.usuario)aplicarEstado(document.getElementById('otro-perfil-estado'),m.usuario);
        pintarChats(chatsCache);
      }
      else if(m.tipo==='perfil'){
        if(perfilAbierto===m.nombre){
          document.getElementById('otro-perfil-nombre').textContent=m.nombre;
          document.getElementById('otro-perfil-bio').textContent=m.bio || '—';
        }
        if(m.nombre === (perfilPropio.nombre || nombre)){
          perfilPropio.bio = m.bio;
        }
      }
      else if(m.tipo==='perfil_actualizado'){
        nombre=m.nombre;
        perfilPropio={nombre:m.nombre,bio:m.bio,avatar:m.avatar||''};
        localStorage.setItem('nombre',nombre);
        actualizarMiAvatar();
        ws.send(JSON.stringify({tipo:'pedir_chats'}));
      }
      else if(m.tipo==='perfil_actualizado_otro'){
        const c=chatsCache.find(x=>x.otro===m.nombre);if(c){c.avatar=m.avatar;}
        const u=usuariosCache.find(x=>x.nombre===m.nombre);if(u){u.avatar=m.avatar;}
        if(chatActual===m.nombre){pintarAvatar(convAvatar,m.avatar,m.nombre);}
        if(perfilAbierto===m.nombre){pintarAvatar(document.getElementById('otro-perfil-avatar'),m.avatar,m.nombre);document.getElementById('otro-perfil-bio').textContent=m.bio||'—';}
        pintarChats(chatsCache); pintarUsuarios(usuariosCache);
      }
      else if(m.tipo==='error')alert(m.texto);
    };
  }

  function pintarChats(chats){
    listaChats.innerHTML='';
    if(!chats.length){const d=document.createElement('div');d.className='vacio';d.innerHTML='No tienes conversaciones.<br>Pulsa el botón + para empezar.';listaChats.appendChild(d);return;}
    chats.forEach(c=>{
      const div=document.createElement('div');
      div.className='chat-item'+(chatActual===c.otro?' activo':'');
      const ult=c.ultimo, escribiendo=escribiendoPorChat[c.otro];
      let preview, clase='ultimo';
      if(escribiendo){preview='Escribiendo...';clase='ultimo escribiendo';}
      else if(ult.imagen)preview='Imagen';
      else preview=(ult.de===nombre?'Tú: ':'')+(ult.texto||'');
      let checkHtml=''; if(ult.de===nombre&&!escribiendo)checkHtml=checkSvg(ult.estado||'enviado');
      const av=document.createElement('div');av.className='avatar';pintarAvatar(av,c.avatar,c.otro);
      const datos=document.createElement('div');datos.className='datos';
      datos.innerHTML=`<div class="fila1"><div class="nombre">${escapar(c.otro)}</div><div class="hora">${ult.hora}</div></div><div class="fila2"><div class="${clase}">${checkHtml}${escapar(preview)}</div>${c.no_leidos>0?`<div class="badge">${c.no_leidos}</div>`:''}</div>`;
      div.appendChild(av);div.appendChild(datos);
      div.onclick=()=>abrirChat(c.otro);
      listaChats.appendChild(div);
    });
  }
  function checkSvg(e){
    if(e==='enviado')return `<span class="check enviado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 7"/></svg></span>`;
    const c=e==='visto'?'visto':'entregado';
    return `<span class="check ${c}"><svg viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 13 7 18 16 7"/><polyline points="12 13 17 18 26 7"/></svg></span>`;
  }

  function pintarUsuarios(usuarios){
    listaUsuarios.innerHTML='';
    const otros=usuarios.filter(u=>u.nombre!==nombre);
    if(!otros.length){const d=document.createElement('div');d.className='vacio';d.textContent='No hay otros usuarios registrados todavía.';listaUsuarios.appendChild(d);return;}
    const on=otros.filter(u=>u.en_linea), off=otros.filter(u=>!u.en_linea);
    const sep=t=>{const s=document.createElement('div');s.className='separador';s.textContent=t;listaUsuarios.appendChild(s);};
    const add=u=>{
      const div=document.createElement('div');div.className='usuario-item';
      const av=document.createElement('div');av.className='avatar';pintarAvatar(av,u.avatar,u.nombre);
      const datos=document.createElement('div');datos.className='datos';
      const est=document.createElement('div');est.className='estado';aplicarEstado(est,u.nombre);
      const nom=document.createElement('div');nom.className='nombre';nom.textContent=u.nombre;
      datos.appendChild(nom);datos.appendChild(est);
      div.appendChild(av);div.appendChild(datos);
      div.onclick=()=>abrirChat(u.nombre);
      listaUsuarios.appendChild(div);
    };
    if(on.length){sep('En línea');on.forEach(add);}
    if(off.length){sep('Desconectados');off.forEach(add);}
  }

  function abrirChat(otro){
    chatActual=otro;app.classList.add('chat-abierto');colDer.classList.remove('vacio');placeholderConv.style.display='none';pantallaConv.style.display='flex';
    convNombre.textContent=otro;
    let c=chatsCache.find(x=>x.otro===otro)||usuariosCache.find(x=>x.nombre===otro);
    pintarAvatar(convAvatar,c?c.avatar:'',otro);actualizarHeaderEstado();mensajesEl.innerHTML='';
    ws.send(JSON.stringify({tipo:'abrir_chat',otro}));
    document.querySelectorAll('.chat-item').forEach(e=>e.classList.toggle('activo',e.querySelector('.nombre')?.textContent===otro));
    miPerfilBtn.classList.add('oculto');
  }
  function actualizarHeaderEstado(){if(chatActual)aplicarEstado(convEstado,chatActual);}
  function abrirConversacion(otro,mensajes,enLinea){
    actualizarHeaderEstado();mensajesEl.innerHTML='';
    mensajes.forEach(m=>pintarMensaje(m,m.de===nombre));
    mensajesEl.scrollTop=mensajesEl.scrollHeight;
    const ids=mensajes.filter(m=>m.de===otro&&m.estado!=='visto').map(m=>m.id);
    if(ids.length)ws.send(JSON.stringify({tipo:'marcar_leido',otro,ids}));
  }
  function recibirMensaje(m,eco){
    const otro=m.de===nombre?m.para:m.de;
    if(chatActual===otro){
      pintarMensaje(m,m.de===nombre);mensajesEl.scrollTop=mensajesEl.scrollHeight;
      if(m.de!==nombre&&perfilAbierto!==otro)ws.send(JSON.stringify({tipo:'marcar_leido',otro,ids:[m.id]}));
    }
    if(!eco&&m.de!==nombre&&chatActual!==otro)ws.send(JSON.stringify({tipo:'pedir_chats'}));
    if(eco)ws.send(JSON.stringify({tipo:'pedir_chats'}));
  }
  function actualizarEstados(ids,estado){
    ids.forEach(id=>{const el=mensajesEl.querySelector(`.msg[data-id="${id}"] .check`);if(el){el.className='check '+estado;el.innerHTML=checkSvg(estado).replace(/^<span[^>]*>|<\/span>$/g,'');}});
    ws.send(JSON.stringify({tipo:'pedir_chats'}));
  }
  
  function pintarMensaje(m,propio){
    const div=document.createElement('div');div.className='msg'+(propio?' propio':'');div.dataset.id=m.id;
    let html='';
    if(m.cita)html+=`<div class="cita"><div class="cita-autor">${escapar(m.cita.autor)}</div><div class="cita-texto">${escapar(m.cita.texto)}</div></div>`;
    if(m.texto)html+=`<div class="texto">${escapar(m.texto)}</div>`;
    
    if(m.imagen_url){
      html+=`<div class="imagen-pendiente" data-img-url="${m.imagen_url}" style="background:#e2e8f0;">
        <div class="difuminado"></div>
        <button class="btn-descargar" type="button" title="Descargar imagen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
        <span class="tamano">${m.imagen_dim?m.imagen_dim+' · ':''}${m.imagen_tamano||''}</span>
      </div>`;
    }
    
    html+=`<div class="meta"><span class="hora">${m.hora}</span>`;
    if(propio)html+=`<span class="check ${m.estado||'enviado'}">${checkSvg(m.estado||'enviado').replace(/^<span[^>]*>|<\/span>$/g,'')}</span>`;
    html+='</div>';
    div.innerHTML=html;mensajesEl.appendChild(div);
    
    div.addEventListener('click',e=>{if(e.target.closest('.imagen-pendiente')||e.target.closest('.imagen-cargada'))return;activarRespuesta(m);});
    
    const pend=div.querySelector('.imagen-pendiente');
    if(pend){
      pend.querySelector('.btn-descargar').addEventListener('click', async (ev) => {
        ev.stopPropagation();
        const url=pend.dataset.imgUrl;
        
        const btn = pend.querySelector('.btn-descargar');
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" stroke-dasharray="56" stroke-dashoffset="28"/></svg>';

        try {
          pend.innerHTML = `<img class="imagen" src="${url}" style="max-width:100%; border-radius:12px;">`;
          pend.classList.remove('imagen-pendiente');
          pend.classList.add('imagen-cargada');
          
          const img = pend.querySelector('img');
          img.addEventListener('click', (e2) => {
             e2.stopPropagation();
             visorImg.src = url;
             visor.classList.add('activo');
          });

        } catch (e) {
          console.error(e);
          alert('No se pudo cargar la imagen');
          btn.innerHTML = '❌';
        }
      });
    }
  }

  function manejarEscribiendo(de,activo){
    escribiendoPorChat[de]=activo;pintarChats(chatsCache);
    if(chatActual===de){actualizarHeaderEstado();if(activo){clearTimeout(escribiendoTimeout);escribiendoTimeout=setTimeout(()=>{escribiendoPorChat[de]=false;pintarChats(chatsCache);if(chatActual===de)actualizarHeaderEstado();},2000);}}
  }
  function activarRespuesta(m){respondiendoA=m.id;respAutor.textContent=m.de===nombre?'Tú':m.de;respTexto.textContent=m.texto?m.texto:'[imagen]';barraResp.classList.add('activa');textoEl.focus();}
  respCerrar.onclick=()=>{respondiendoA=null;barraResp.classList.remove('activa');};

  function bytesRestantes(b){if(b<1024)return `${b} B`;if(b<1024*1024)return `${(b/1024).toFixed(1)} KB`;return `${(b/(1024*1024)).toFixed(1)} MB`;}

  async function enviarImagen(file){
    const para=chatActual;if(!para)return;
    
    const tmpId = 'tmp_' + Date.now();
    const div = document.createElement('div');
    div.className = 'msg propio';
    div.dataset.id = tmpId;
    div.innerHTML = `<div class="imagen-pendiente" style="background:#e2e8f0;">
        <div class="difuminado"></div>
        <button class="btn-descargar" type="button"><svg class="anillo-progreso" viewBox="0 0 46 46"><circle class="fondo" cx="23" cy="23" r="20"/><circle class="frente" cx="23" cy="23" r="20" stroke-dasharray="125.6" stroke-dashoffset="125.6"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="position:relative;z-index:1;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        <span class="tamano">${bytesRestantes(file.size)}</span>
      </div>`;
    mensajesEl.appendChild(div);
    mensajesEl.scrollTop=mensajesEl.scrollHeight;

    try {
      const formData = new FormData();
      formData.append('file', file);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://seend-i33g.onrender.com/api/upload', true);
      
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const anillo = div.querySelector('.frente');
          if (anillo) anillo.setAttribute('stroke-dashoffset', String(125.6 * (1 - e.loaded / e.total)));
        }
      };

      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          const data = JSON.parse(xhr.responseText);
          ws.send(JSON.stringify({
            tipo: 'mensaje', para, texto: textoEl.value.trim(), 
            imagen_url: data.url, 
            imagen_tamano: bytesRestantes(file.size), 
            responder_a: respondiendoA
          }));
          textoEl.value='';textoEl.style.height='auto';respondiendoA=null;barraResp.classList.remove('activa');actualizarBotonEnviar();
          div.remove();
        } else {
          div.querySelector('.tamano').textContent = 'Error al subir';
        }
      };

      xhr.onerror = () => { div.querySelector('.tamano').textContent = 'Error de red'; };
      xhr.send(formData);

    } catch (e) {
      console.error(e);
      div.querySelector('.tamano').textContent = 'Error';
    }
  }

  async function cambiarAvatar(file){
    try{
      const formData = new FormData();
      formData.append('file', file);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://seend-i33g.onrender.com/api/upload', true);
      
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          const data = JSON.parse(xhr.responseText);
          ws.send(JSON.stringify({tipo:'actualizar_perfil',nombre:perfilPropio.nombre||nombre,bio:perfilPropio.bio||'',avatar_url:data.url}));
        } else {
          alert('Error al subir la foto. Asegúrate de que sea menor de 300KB.');
        }
      };
      xhr.onerror = () => alert('Error de red al subir la foto');
      xhr.send(formData);
    }catch(e){console.error(e);alert('Error al subir la foto: '+e.message);}
  }

  btnImagen.onclick=()=>fileInput.click();
  fileInput.onchange=()=>{const f=fileInput.files[0];if(!f)return;if(f.size>4*1024*1024){alert('La imagen supera los 4 MB');fileInput.value='';return;}enviarImagen(f);fileInput.value='';};

  formEl.onsubmit=e=>{e.preventDefault();enviar();};
  function enviar(){
    const v=textoEl.value.trim();
    if(!v||!chatActual||ws.readyState!==1)return;
    ws.send(JSON.stringify({tipo:'mensaje',para:chatActual,texto:v,responder_a:respondiendoA}));
    textoEl.value='';textoEl.style.height='auto';respondiendoA=null;barraResp.classList.remove('activa');
    ws.send(JSON.stringify({tipo:'escribiendo',para:chatActual,activo:false}));ultimoEnvioEscribiendo=0;actualizarBotonEnviar();
  }
  function actualizarBotonEnviar(){btnEnviar.disabled=!textoEl.value.trim();}
  textoEl.addEventListener('input',()=>{
    actualizarBotonEnviar();textoEl.style.height='auto';textoEl.style.height=Math.min(textoEl.scrollHeight,120)+'px';
    if(ws&&ws.readyState===1&&chatActual){const a=Date.now(),act=textoEl.value.length>0;if(!act||a-ultimoEnvioEscribiendo>=1000){ws.send(JSON.stringify({tipo:'escribiendo',para:chatActual,activo:act}));ultimoEnvioEscribiendo=a;}}
  });
  textoEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar();}});
  visor.onclick=()=>visor.classList.remove('activo');
  function escapar(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  setInterval(()=>{if(chatActual)actualizarHeaderEstado();if(perfilAbierto)aplicarEstado(document.getElementById('otro-perfil-estado'),perfilAbierto);if(listaUsuarios.style.display!=='none')pintarUsuarios(usuariosCache);},30000);
  conectar();
</script>
</body>
