<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Entrar · Seend</title>
<style>
  :root {
    --azul: #007aff;
    --fondo: #ffffff;
    --fondo-gris: #f2f2f7;
    --texto: #1c1c1e;
    --texto-suave: #8e8e93;
    --borde: #e5e5ea;
    --error: #ff3b30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo); color: var(--texto);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
    -webkit-tap-highlight-color: transparent;
  }

  /* Contenedor principal */
  .container {
    width: 100%; max-width: 360px;
    display: flex; flex-direction: column;
  }

  /* Título minimalista */
  .header { text-align: center; margin-bottom: 40px; }
  .header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
  .header p { font-size: 15px; color: var(--texto-suave); }

  /* Pestañas */
  .tabs {
    display: flex; justify-content: center; gap: 20px; margin-bottom: 30px;
    border-bottom: 1px solid var(--borde);
  }
  .tabs button {
    background: none; border: none; padding: 10px 0;
    font-size: 15px; font-weight: 500; color: var(--texto-suave);
    cursor: pointer; position: relative; transition: color .2s; font-family: inherit;
  }
  .tabs button.activo { color: var(--texto); }
  .tabs button.activo::after {
    content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
    height: 2px; background: var(--texto); border-radius: 2px 2px 0 0;
  }

  /* Campos de texto */
  .campo { margin-bottom: 16px; position: relative; }
  .campo input {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    font-size: 16px; outline: none; font-family: inherit; color: var(--texto);
    background: var(--fondo-gris); transition: background .2s;
  }
  .campo input:focus { background: #e5e5ea; }
  .campo input::placeholder { color: var(--texto-suave); }
  
  /* Ojo para contraseña */
  .btn-ojo {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--texto-suave); cursor: pointer; padding: 0;
    display: flex; align-items: center;
  }
  .btn-ojo svg { width: 20px; height: 20px; }

  /* Mensaje de error */
  .error-msg {
    color: var(--error); font-size: 13px; text-align: center;
    margin-bottom: 16px; display: none;
  }
  .error-msg.activa { display: block; }

  /* Botón principal */
  .btn-principal {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    background: var(--azul); color: white; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: opacity .2s; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 10px;
  }
  .btn-principal:active { opacity: 0.8; }
  .btn-principal:disabled { background: #c7c7cc; cursor: not-allowed; }

  /* Spinner */
  .spinner {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.4);
    border-top-color: white; border-radius: 50%;
    animation: girar .8s linear infinite; display: none;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  .oculto { display: none !important; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Seend</h1>
    <p id="subtitulo">Bienvenido de nuevo</p>
  </div>

  <div class="tabs">
    <button id="tab-login" class="activo" type="button">Iniciar sesión</button>
    <button id="tab-registro" type="button">Crear cuenta</button>
  </div>

  <div class="error-msg" id="error"></div>

  <form id="form">
    <div class="campo">
      <input id="nombre" maxlength="20" autocomplete="username" placeholder="Nombre de usuario" autofocus>
    </div>
    
    <div class="campo">
      <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
      <button type="button" class="btn-ojo" id="btn-ojo-pass">
        <svg id="icono-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="campo oculto" id="campo-confirmar">
      <input id="confirmar" type="password" autocomplete="new-password" placeholder="Confirmar contraseña">
    </div>

    <button class="btn-principal" id="btn-submit" type="submit">
      <span id="btn-texto">Entrar</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </form>
</div>

<script>
  let modo = "login", ws;
  const tabLogin = document.getElementById('tab-login');
  const tabRegistro = document.getElementById('tab-registro');
  const campoConfirmar = document.getElementById('campo-confirmar');
  const btnSubmit = document.getElementById('btn-submit');
  const btnTexto = document.getElementById('btn-texto');
  const spinner = document.getElementById('spinner');
  const subtitulo = document.getElementById('subtitulo');
  const errorEl = document.getElementById('error');
  const form = document.getElementById('form');
  const passInput = document.getElementById('password');
  const confirmarInput = document.getElementById('confirmar');
  const nombreInput = document.getElementById('nombre');

  document.getElementById('btn-ojo-pass').onclick = () => {
    const esPass = passInput.type === 'password';
    passInput.type = esPass ? 'text' : 'password';
    document.getElementById('icono-ojo').innerHTML = esPass 
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  };

  function mostrarError(t) { errorEl.textContent = t; errorEl.classList.add('activa'); }
  function limpiarError() { errorEl.classList.remove('activa'); }

  function setModo(m) {
    modo = m; limpiarError();
    if (m === 'login') {
      tabLogin.classList.add('activo'); tabRegistro.classList.remove('activo');
      campoConfirmar.classList.add('oculto'); btnTexto.textContent = 'Entrar';
      subtitulo.textContent = 'Bienvenido de nuevo';
    } else {
      tabRegistro.classList.add('activo'); tabLogin.classList.remove('activo');
      campoConfirmar.classList.remove('oculto'); btnTexto.textContent = 'Crear cuenta';
      subtitulo.textContent = 'Únete a la conversación';
    }
  }
  
  tabLogin.onclick = () => setModo('login');
  tabRegistro.onclick = () => setModo('registro');

  function setCargando(c) {
    btnSubmit.disabled = c;
    btnTexto.classList.toggle('oculto', c);
    spinner.style.display = c ? 'block' : 'none';
  }

  function conectar() {
    return new Promise((res, rej) => {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => res(ws);
      ws.onerror = () => rej(new Error('No se pudo conectar'));
      ws.onmessage = e => {
        const m = JSON.parse(e.data);
        if (m.tipo === 'auth_ok') {
          localStorage.setItem('token', m.token); localStorage.setItem('nombre', m.nombre);
          window.location.href = 'chat.html';
        } else if (m.tipo === 'error') {
          mostrarError(m.texto); setCargando(false);
        }
      };
    });
  }

  form.onsubmit = async (e) => {
    e.preventDefault(); limpiarError();
    const nombre = nombreInput.value.trim(), password = passInput.value, confirmar = confirmarInput.value;
    if (!nombre || !password) { mostrarError('Completa todos los campos.'); return; }
    if (password.length < 4) { mostrarError('La contraseña debe tener al menos 4 caracteres.'); return; }
    if (modo === 'registro' && password !== confirmar) { mostrarError('Las contraseñas no coinciden.'); return; }
    
    setCargando(true);
    try {
      if (!ws || ws.readyState !== 1) await conectar();
      ws.send(JSON.stringify({ tipo: modo === 'login' ? 'login' : 'registro', nombre, password }));
    } catch (err) { 
      mostrarError(err.message); 
      setCargando(false); 
    }
  };
</script>
</body>
</html>
